apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "vectorguard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vectorguard.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "vectorguard.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "vectorguard.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "vectorguard.serviceAccountName" . }}
      hostPID:     true
      hostNetwork: true
      dnsPolicy:   ClusterFirstWithHostNet
      tolerations:
        {{- toYaml .Values.daemonset.tolerations | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.daemonset.nodeSelector | nindent 8 }}
      initContainers:
        - name: init-bpf-fs
          image: busybox:1.36
          command:
            - sh
            - -c
            - mount | grep -q "/sys/fs/bpf" || mount -t bpf bpf /sys/fs/bpf
          securityContext:
            privileged: true
      containers:
        - name: vectorguard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/vectorguard/config.toml"]
          securityContext:
            privileged: {{ .Values.daemonset.privileged }}
            {{- if not .Values.daemonset.privileged }}
            capabilities:
              add: [SYS_ADMIN, BPF, PERFMON, NET_ADMIN, SYS_PTRACE]
              drop: [ALL]
            {{- end }}
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: {{ .Values.daemonset.privileged }}
          env:
            - name: RUST_LOG
              value: {{ .Values.config.logLevel | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.config.slowPath.embedder.apiKeySecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.slowPath.embedder.apiKeySecret }}
                  key: openai-api-key
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/vectorguard
              readOnly: true
            - name: rules
              mountPath: /etc/vectorguard/rules
              readOnly: true
            - name: bpf-fs
              mountPath: /sys/fs/bpf
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: proc
              mountPath: /proc
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.daemonset.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["test", "-f", "/tmp/vectorguard.ready"]
            initialDelaySeconds: 10
            periodSeconds:       30
            failureThreshold:    3
      volumes:
        - name: config
          configMap:
            name: {{ include "vectorguard.fullname" . }}-config
            items:
              - key: config.toml
                path: config.toml
        - name: rules
          configMap:
            name: {{ include "vectorguard.fullname" . }}-config
            items:
              - key: default.toml
                path: default.toml
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: tmp
          emptyDir: {}
