[system]
log_level = "info"       # debug | info | warn | error
hot_reload = true

# ── Monitoring Targets ────────────────────────────────────────
[scope]
# Glob patterns matched against process binary name. Empty = all processes.
targets = []
# Process binary names (globs) to always exclude — noisy system daemons.
exclude_processes = ["systemd-journald", "journald", "systemd", "sd-journal", "kworker*", "kthread*", "ksoftirqd*", "migration*"]
# K8s namespace glob patterns to include (non-empty = allowlist). Non-K8s events unaffected.
include_namespaces = []
# K8s namespace glob patterns to exclude (takes precedence over include). Non-K8s events unaffected.
exclude_namespaces = ["kube-system", "kube-public", "kube-node-lease"]
# K8s pod label selectors: ALL "key=value" pairs must match. Empty = no label filter.
label_selectors = []

# ── Adapter Selection ─────────────────────────────────────────
[adapter]
backend = "tetragon"   # tetragon | falco | auditd | native_ebpf

[adapter.tetragon]
endpoint = "http://localhost:54321"

[adapter.falco]
log_path = "/var/log/falco/events.json"

[adapter.auditd]
log_path = "/var/log/audit/audit.log"

# ── Fast Path ────────────────────────────────────────────────
[fast_path]
enabled = true
rules_path = "../rules"            # dev: rules/ in repo, prod: /etc/vectorguard/rules/
default_action = "block"   # block | alert | log

# ── Slow Path ────────────────────────────────────────────────
[slow_path]
enabled = true
time_window_secs = 60
similarity_threshold = 0.85

[slow_path.embedder]
# backend = "local" is a deterministic byte-hash with no semantic structure —
# it produces identical vectors for identical metadata and is essentially a
# novelty cache, not real anomaly detection. Use it only for offline/dev
# runs. For meaningful detection, point "local" at an Ollama endpoint or
# use one of the hosted backends below.
backend = "local"          # local | openai | voyage | gemini
model = "nomic-embed-text"
api_key_env = ""
# endpoint = "http://localhost:11434"   # optional: Ollama endpoint for local backend
#
# Examples:
#   OpenAI:  backend="openai"  model="text-embedding-3-small"  api_key_env="OPENAI_API_KEY"
#   Voyage:  backend="voyage"  model="voyage-3"                api_key_env="VOYAGE_API_KEY"
#   Gemini:  backend="gemini"  model="text-embedding-004"      api_key_env="GEMINI_API_KEY"
#   Ollama:  backend="local"   model="nomic-embed-text"        endpoint="http://localhost:11434"

[slow_path.vectordb]
backend = "qdrant"         # qdrant | usearch
url = "http://localhost:6333"
collection = "behaviors"

# ── AI Rule Advisor ──────────────────────────────────────────
[ai_advisor]
enabled              = false
provider             = "anthropic"           # anthropic | openai
api_key_env          = "ANTHROPIC_API_KEY"   # env var holding the key (never put plaintext keys here)
model                = "claude-sonnet-4-6"  # anthropic: claude-sonnet-4-6 etc; openai: gpt-4o etc
trigger_threshold    = 3                     # same pattern N times → call AI
cooldown_seconds     = 300                   # min gap between API calls per pattern
context_window_size  = 20                    # recent events sent as context
window_secs          = 60                    # sliding window duration

# ── AI Advisor Approval ─────────────────────────────────────
# Proposed rules go through an approval flow before they reach the daemon:
#   manual → staged under `pending_dir`, surfaced in the TUI's "AI Pending" tab
#            and via `vectorguard list-pending` / `approve <id>` / `reject <id>`
#   auto   → written straight into rules_path as `ai-approved-*.toml`
# A reaper sweeps `ai-approved-*.toml` files older than approval_ttl_secs so
# AI-generated rules don't accumulate indefinitely.
max_rules_per_fire   = 3                     # cap rules accepted per LLM call
approval_mode        = "manual"              # manual | auto
pending_dir          = "/etc/vectorguard/pending"
approval_ttl_secs    = 600                   # remove approved AI rules after this
reaper_interval_secs = 60                    # how often the reaper sweeps

# ── TUI ─────────────────────────────────────────────────────
[tui]
refresh_rate_ms = 200
theme = "dark"             # dark | light
