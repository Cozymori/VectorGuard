[package]
name = "vectorguard"
version = "0.1.0"
edition = "2024"

[dependencies]
vectorguard-common = { path = "../vectorguard-common" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde_json = "1"
notify = "6"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json"] }
glob = "0.3"
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
prost-types = "0.13"

# Linux only (eBPF loader)
[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.13", features = ["async_tokio"] }
aya-log = "0.2"

[build-dependencies]
aya-build = "0.1"
tonic-build = "0.12"
