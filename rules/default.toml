# VectorGuard Fast Path Default Rules
# action: block | alert | log | allow

# ── Block access to sensitive files ───────────────────────────
[[rules]]
name   = "block-shadow-access"
action = "block"
match_path_prefix = ["/etc/shadow", "/etc/gshadow", "/etc/sudoers"]

[[rules]]
name   = "block-ssh-key-access"
action = "block"
match_path_prefix = ["/root/.ssh/", "/home/"]
match_exec_path   = ["/bin/bash", "/bin/sh", "/usr/bin/python3"]

# ── Detect shell execution by service processes ───────────────
[[rules]]
name   = "alert-webserver-shell"
action = "alert"
match_process   = ["nginx", "apache2", "httpd", "php-fpm"]
match_exec_path = ["/bin/sh", "/bin/bash", "/bin/dash"]

[[rules]]
name   = "alert-db-shell"
action = "alert"
match_process   = ["postgres", "mysqld", "mongod"]
match_exec_path = ["/bin/sh", "/bin/bash"]

# ── Suspicious outbound ports ─────────────────────────────────
[[rules]]
name       = "alert-suspicious-port"
action     = "alert"
match_port = [4444, 1337, 31337, 9001, 8888, 6666]

# ── Network tool execution by root ────────────────────────────
[[rules]]
name          = "alert-root-nettools"
action        = "alert"
match_uid     = 0
match_exec_path = ["/usr/bin/wget", "/usr/bin/curl", "/usr/bin/nc", "/usr/bin/ncat"]

# ── Kernel module load detection ──────────────────────────────
[[rules]]
name          = "alert-insmod"
action        = "alert"
match_exec_path = ["/sbin/insmod", "/sbin/modprobe", "/usr/sbin/insmod"]
