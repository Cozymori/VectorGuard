services:
  vectorguard:
    image: vectorguard:dev
    build: .
    privileged: true          # Required for eBPF program loading
    pid: host                 # Host PID namespace access for process tree visibility
    network_mode: host
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - ./vectorguard/config.toml:/etc/vectorguard/config.toml
      - ./rules:/etc/vectorguard/rules:ro
    environment:
      - RUST_LOG=info
    command: ["--config", "/etc/vectorguard/config.toml"]
    depends_on:
      qdrant:
        condition: service_healthy

  # Vector database for Slow Path anomaly detection
  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  qdrant_data:
